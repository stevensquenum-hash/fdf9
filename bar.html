<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bar">
<title>Bar</title>
<link rel="stylesheet" href="style.css?v=2">
<style>
/* Styles propres à la page Bar */
.stats{grid-template-columns:repeat(3,1fr)}
.ticket{border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:8px}
.ticket.new{border-color:var(--amber)}
.ticket.ready{border-color:var(--green)}
.ticket.served{border-color:var(--border2);opacity:.7}
.ticket-hdr{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--bg2);cursor:pointer}
.ticket.new .ticket-hdr{background:var(--al)}
.ticket.ready .ticket-hdr{background:var(--gl)}
.ttag{min-width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;background:var(--bl);color:var(--bld)}
.ticket.new .ttag{background:var(--al);color:var(--ald);border:2px solid var(--amber)}
.ticket.ready .ttag{background:var(--gl);color:var(--gld);border:2px solid var(--green)}
.tname{flex:1;font-size:14px;font-weight:600}
.sbadge-new{font-size:10px;background:var(--al);color:var(--ald);padding:3px 8px;border-radius:99px;font-weight:700;white-space:nowrap}
.sbadge-ready{font-size:10px;background:var(--gl);color:var(--gld);padding:3px 8px;border-radius:99px;font-weight:700;white-space:nowrap}
.sbadge-served{font-size:10px;background:var(--bg2);color:var(--text2);padding:3px 8px;border-radius:99px;font-weight:700;white-space:nowrap}
.ticket-body{padding:10px 12px;border-top:1px solid var(--border);display:none}
.ticket-body.open{display:block}
.dline{padding:8px 0;border-bottom:1px solid var(--border)}
.dline:last-of-type{border-bottom:none}
.dtop{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
.dline .qty{font-size:12px;background:var(--bg3);color:var(--text2);padding:1px 6px;border-radius:99px;font-weight:700}
.recipe{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.5}
.kacts{margin-top:10px}
.kbtn{width:100%;padding:9px 16px;border-radius:var(--r);font-size:13px;cursor:pointer;border:1px solid var(--border2);background:var(--bg);color:var(--text);min-height:40px;font-weight:600}
.kbtn:active{transform:scale(.97)}
.kbtn.ready{background:var(--green);color:#fff;border-color:var(--green)}
.kbtn.unready{background:var(--bg2);color:var(--text2);font-size:12px}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div><h1>🍹 Bar</h1><span class="badge" id="evt-badge"></span></div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="sbtn" onclick="openStockModal()">🚫 Stock</button>
      <div class="live" id="live-status"><span class="live-dot"></span>Connexion…</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="v" id="s-new">0</div><div class="l">Nouvelles</div></div>
    <div class="stat"><div class="v" id="s-ready">0</div><div class="l">Prêtes</div></div>
    <div class="stat"><div class="v" id="s-served">0</div><div class="l">Servies</div></div>
  </div>

  <div class="tabs" id="view-tabs">
    <button class="tab active" id="tab-new"    onclick="goView('new')">🆕 Nouvelles</button>
    <button class="tab"        id="tab-ready"  onclick="goView('ready')">✅ Prêtes</button>
    <button class="tab"        id="tab-served" onclick="goView('served')">🍹 Servies</button>
  </div>

  <div class="card">
    <div class="ctitle" id="ctitle">Nouvelles commandes</div>
    <div id="tickets-list"><div class="connecting">Connexion à Firebase…</div></div>
  </div>
</div>

<div class="mbg" id="stock-modal" style="display:none" onclick="closeStockModalOut(event)">
  <div class="modal">
    <div class="mhdr">
      <h2>🚫 Ruptures de stock — Cocktails</h2>
      <button class="mcls" onclick="closeStockModal()">✕</button>
    </div>
    <p style="font-size:12px;color:var(--text2);margin-bottom:10px">Un cocktail coché apparaît grisé et non sélectionnable côté Serveurs, immédiatement.</p>
    <div id="stock-fields"></div>
    <button class="msave" onclick="saveStock()">Enregistrer</button>
  </div>
</div>

<script src="menu-data.js?v=2"></script>
<script src="firebase-config.js?v=2"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
document.title = 'Bar — ' + EVENT_LABEL;
document.getElementById('evt-badge').textContent = EVENT_LABEL;

let orders = {};
for (let t = 1; t <= T; t++) orders[t] = {};
let soldOut = {}; // { cocktail1: true, … } — partagé avec Serveurs et Cuisine
let curView = 'new'; // 'new' | 'ready' | 'served'

firebase.initializeApp(FB_CONFIG);
const db = firebase.firestore();

// ─── Écoute temps réel avec reconnexion automatique ──────────────────────────
let unsubscribe = null, reconnectTimer = null, lastUpdate = Date.now();

function startListen() {
  if (unsubscribe) unsubscribe();
  unsubscribe = db.collection('evenement').doc('data').onSnapshot(snap => {
    lastUpdate = Date.now();
    document.getElementById('live-status').innerHTML = '<span class="live-dot"></span>En direct';
    if (!snap.exists) {
      document.getElementById('tickets-list').innerHTML = '<div class="connecting">Aucune commande encore.</div>';
      updStats(); return;
    }
    const d = snap.data();
    soldOut = d.soldOut || {};
    if (d.orders) {
      for (let t = 1; t <= T; t++) {
        const src = d.orders[t] || d.orders[String(t)] || {};
        orders[t] = {};
        Object.keys(src).forEach(g => { orders[t][Number(g)] = src[g]; });
      }
      for (let t = 1; t <= T; t++) if (!orders[t]) orders[t] = {};
    }
    render(); updStats();
  }, err => {
    console.warn('Erreur snapshot:', err);
    document.getElementById('live-status').innerHTML = '<span style="color:#D85A30">⚠ Hors ligne — reconnexion…</span>';
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(startListen, 5000);
  });
}
setInterval(() => { if (Date.now()-lastUpdate > 30000) startListen(); }, 15000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') startListen(); });

// ─── SYNC ─────────────────────────────────────────────────────────────────────
function syncFirebase() {
  // .update() remplace tout le champ orders — contrairement à .set(...,{merge:true}), qui fusionne
  // en profondeur et empêcherait "Remettre en attente" de bien s'annuler côté serveur.
  db.collection('evenement').doc('data').update({orders})
    .then(() => { render(); updStats(); })
    .catch(e => console.warn('Erreur sync:', e));
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
function markReady(t,g,rk) {
  if (!orders[t][g] || !orders[t][g][rk]) return;
  orders[t][g][rk].barStatus = 'ready';
  syncFirebase();
}
function unmarkReady(t,g,rk) {
  if (!orders[t][g] || !orders[t][g][rk]) return;
  delete orders[t][g][rk].barStatus;
  syncFirebase();
}

// ─── RUPTURES DE STOCK (COCKTAILS) ────────────────────────────────────────────
function openStockModal() {
  const el = document.getElementById('stock-fields');
  el.innerHTML = '';
  COCKTAILS.forEach(item => {
    const row = document.createElement('div');
    row.className = 'prow';
    row.innerHTML =
      '<label>' + item.label + '</label>' +
      '<input type="checkbox" id="stock-' + item.id + '" ' + (soldOut[item.id] ? 'checked' : '') + ' style="width:20px;height:20px">';
    el.appendChild(row);
  });
  document.getElementById('stock-modal').style.display = 'flex';
}
function closeStockModal() { document.getElementById('stock-modal').style.display = 'none'; }
function closeStockModalOut(e) { if (e.target === document.getElementById('stock-modal')) closeStockModal(); }
function saveStock() {
  COCKTAILS.forEach(item => {
    const cb = document.getElementById('stock-' + item.id);
    if (!cb) return;
    if (cb.checked) soldOut[item.id] = true; else delete soldOut[item.id];
  });
  db.collection('evenement').doc('data').update({ soldOut })
    .then(closeStockModal)
    .catch(e => console.warn('Erreur sauvegarde stock:', e));
}

// ─── NAVIGATION PAR ONGLET ─────────────────────────────────────────────────────
const VIEW_TITLES = { new: 'Nouvelles commandes', ready: 'Boissons prêtes', served: 'Commandes servies' };

function goView(v) {
  curView = v;
  ['new','ready','served'].forEach(x => document.getElementById('tab-'+x).classList.toggle('active', x===v));
  render();
}

// Une commande a des boissons si un soft/mocktail/cocktail a été pris, ou si un
// mocktail enfant est attaché.
function hasDrinks(o) {
  if (Object.values(o.dr||{}).some(v => v > 0)) return true;
  if (o.child && o.child.mock) return true;
  return false;
}

function drinkItems(o) {
  const items = Object.entries(o.dr||{}).filter(([k,v]) => v > 0);
  if (o.child && o.child.mock) items.push([o.child.mock, 1]);
  return items;
}

function renderDrinkLine(id, qty) {
  const item = DRINKS.find(i => i.id === id);
  const label = item ? item.label : id;
  const recipe = item && item.recipe ? '<div class="recipe">' + item.recipe + '</div>' : '';
  return '<div class="dline"><div class="dtop"><span>'+label+'</span>'+(qty>1?'<span class="qty">×'+qty+'</span>':'')+'</div>'+recipe+'</div>';
}

function renderTicket(t, g, rk, o, ks) {
  const totalRounds = Object.keys(orders[t][g] || {}).length;
  const rNum = totalRounds>1 ? ' Svc '+rk.replace('r',''):'';
  const label = 'T'+t+' · C'+g+rNum;

  let badge = '';
  if (ks==='new')    badge = '<span class="sbadge-new">Nouvelle</span>';
  if (ks==='ready')  badge = '<span class="sbadge-ready">✅ Prête</span>';
  if (ks==='served') badge = '<span class="sbadge-served">Servie</span>';

  let actions = '';
  if (ks==='new')   actions = '<div class="kacts"><button class="kbtn ready" onclick="markReady('+t+','+g+',\''+rk+'\')">✅ Prêt</button></div>';
  if (ks==='ready') actions = '<div class="kacts"><button class="kbtn unready" onclick="unmarkReady('+t+','+g+',\''+rk+'\')">↩ Remettre en attente</button></div>';

  const items = drinkItems(o).map(([id,qty]) => renderDrinkLine(id, qty)).join('');

  return '<div class="ticket '+ks+'">' +
      '<div class="ticket-hdr" onclick="this.nextElementSibling.classList.toggle(\'open\')">' +
        '<div class="ttag">C'+g+'</div>' +
        '<span class="tname">'+label+'</span>' +
        badge +
      '</div>' +
      '<div class="ticket-body open">'+items+actions+'</div>' +
    '</div>';
}

// File de travail : toutes les commandes du statut courant, toutes tables
// confondues, triées par ordre d'arrivée.
function render() {
  document.getElementById('ctitle').textContent = VIEW_TITLES[curView];
  const list = [];
  for (let t = 1; t <= T; t++) {
    const tbl = orders[t] || {};
    Object.keys(tbl).forEach(g => {
      Object.keys(tbl[g]).forEach(rk => {
        const o = tbl[g][rk];
        if (!hasDrinks(o)) return;
        const ks = o.served ? 'served' : (o.barStatus==='ready' ? 'ready' : 'new');
        if (ks !== curView) return;
        list.push({ t, g: Number(g), rk, o, ks });
      });
    });
  }
  list.sort((a,b) => (a.o.createdAt||0) - (b.o.createdAt||0));
  const el = document.getElementById('tickets-list');
  el.innerHTML = list.map(x => renderTicket(x.t, x.g, x.rk, x.o, x.ks)).join('') || '<div class="empty">Aucune commande</div>';
}

function updStats() {
  let sN=0, sR=0, sS=0;
  for (let t=1;t<=T;t++) {
    Object.keys(orders[t]||{}).forEach(g => {
      Object.keys(orders[t][g]).forEach(rk => {
        const o = orders[t][g][rk];
        if (!hasDrinks(o)) return;
        if (o.served) sS++;
        else if (o.barStatus==='ready') sR++;
        else sN++;
      });
    });
  }
  document.getElementById('s-new').textContent    = sN;
  document.getElementById('s-ready').textContent  = sR;
  document.getElementById('s-served').textContent = sS;
  document.getElementById('tab-new').textContent    = '🆕 Nouvelles' + (sN ? ' ('+sN+')' : '');
  document.getElementById('tab-ready').textContent  = '✅ Prêtes'    + (sR ? ' ('+sR+')' : '');
  document.getElementById('tab-served').textContent = '🍹 Servies'  + (sS ? ' ('+sS+')' : '');
}

startListen();
</script>
</body>
</html>
